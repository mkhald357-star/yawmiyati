 html,body{margin:0;padding:0;background:#EFF0EC;-webkit-text-size-adjust:100%}
 @media (prefers-color-scheme: dark){html,body{background:#141613}}
</style>
<script>
/* ============================================================
   يومياتي — طبقة التخزين للنسخة المستقلّة (PWA)
   داخل محادثة Claude كان window.storage جاهزاً. هنا نبنيه فوق
   IndexedDB: نفس الواجهة تماماً (get/set) فلا يتغيّر سطر واحد
   من منطق التطبيق، ومع سعة تكفي نغمة صوتية كاملة.
   ============================================================ */
(function(){
if(window.storage) return;                 // داخل Claude: لا تلمس شيئاً
const DB='yawmiyati',STORE='kv';
let dbp=null;
function open(){
 if(dbp)return dbp;
 dbp=new Promise((res,rej)=>{
  const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE);};
  r.onsuccess=()=>res(r.result);
  r.onerror=()=>rej(r.error);
 });
 return dbp;
}
function tx(mode,fn){
 return open().then(db=>new Promise((res,rej)=>{
  const t=db.transaction(STORE,mode),st=t.objectStore(STORE);
  const out=fn(st);
  t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);
  t.onerror=()=>rej(t.error);
  t.onabort=()=>rej(t.error);
 }));
}
window.storage={
 async get(key){
  const v=await tx('readonly',st=>st.get(key));
  if(v===undefined||v===null)throw new Error('not found: '+key);
  return {key,value:v};
 },
 async set(key,value){
  await tx('readwrite',st=>st.put(value,key));
  return {key,value};
 },
 async delete(key){
  await tx('readwrite',st=>st.delete(key));
  return {key,deleted:true};
 }
};
/* ترحيل: لو كانت هناك بيانات قديمة في localStorage من تجربة سابقة */
try{
 const legacy=localStorage.getItem('yawmiyati:v3');
 if(legacy){window.storage.get('yawmiyati:v3').catch(()=>window.storage.set('yawmiyati:v3',legacy));}
}catch(e){}
})();

</script>

async function syncCloud(manual){
 const url=S.set.syncUrl?S.set.syncUrl.trim():'';
 if(!url){if(manual)toast('الرجاء إدخال رابط المزامنة أولاً');return;}
 const db=(S.set.syncDb||'yawmiyati').trim();
 const doc=(S.set.syncDoc||'state').trim();
 let baseUrl=url.endsWith('/')?url.slice(0,-1):url;
 const docUrl=`${baseUrl}/${db}/${doc}`;
 const headers={'Content-Type':'application/json'};
 if(S.set.syncUser&&S.set.syncPass){
  headers['Authorization']='Basic '+btoa(unescape(encodeURIComponent(S.set.syncUser+':'+S.set.syncPass)));
 }
 if(manual)toast('جاري المزامنة مع السحابة...');
 try{
  if(!navigator.onLine){
   if(manual)toast('أنت غير متصل بالإنترنت حالياً');
   return;
  }
  let res=await fetch(docUrl,{headers});
  let remoteDoc=null;
  if(res.status===404){
   const dbRes=await fetch(`${baseUrl}/${db}`,{headers});
   if(dbRes.status===404){
    const createDbRes=await fetch(`${baseUrl}/${db}`,{method:'PUT',headers});
    if(!createDbRes.ok)throw new Error('تعذر إنشاء قاعدة البيانات على الخادم');
   }
  }else if(!res.ok){
   throw new Error(`خطأ من الخادم: ${res.status}`);
  }else{
   remoteDoc=await res.json();
  }
  if(!S.lastUpdated)S.lastUpdated=Date.now();
  if(!remoteDoc){
   const body=Object.assign({},S,{_id:doc,lastUpdated:S.lastUpdated});
   delete body._rev;
   const putRes=await fetch(docUrl,{method:'PUT',headers,body:JSON.stringify(body)});
   if(!putRes.ok)throw new Error('فشل رفع البيانات لأول مرة');
   const putData=await putRes.json();
   S._rev=putData.rev;
   save();
   toast('تم رفع البيانات المحلية إلى السحابة بنجاح');
  }else{
   const remoteLastUpdated=remoteDoc.lastUpdated||0;
   const localLastUpdated=S.lastUpdated||0;
   if(remoteLastUpdated>localLastUpdated){
    const newS=Object.assign({},remoteDoc);
    S=Object.assign(S,newS);
    await window.storage.set(KEY,JSON.stringify(S));
    render();
    toast('تم تحميل البيانات الأحدث من السحابة');
   }else if(localLastUpdated>remoteLastUpdated){
    const body=Object.assign({},S,{_id:doc,_rev:remoteDoc._rev,lastUpdated:S.lastUpdated});
    const putRes=await fetch(docUrl,{method:'PUT',headers,body:JSON.stringify(body)});
    if(!putRes.ok){
     if(putRes.status===409){
      if(manual)toast('حدث تعارض، جاري إعادة المحاولة...');
      return syncCloud(manual);
     }
     throw new Error('فشل تحديث البيانات في السحابة');
    }
    const putData=await putRes.json();
    S._rev=putData.rev;
    save();
    toast('تم تحديث البيانات في السحابة بنجاح');
   }else{
    if(manual)toast('البيانات متطابقة مع السحابة بالفعل');
   }
  }
 }catch(err){
  console.error(err);
 }
}

async function findGoogleFile(token) {
 const r = await fetch("https://www.googleapis.com/drive/v3/files?q=name='yawmiyati_backup.json'+and+trashed=false&fields=files(id,name,modifiedTime)", {
  headers: { 'Authorization': `Bearer ${token}` }
 });
 if (!r.ok) throw new Error('تعذر البحث عن الملف في جوجل درايف');
 const data = await r.json();
 return data.files && data.files.length ? data.files[0] : null;
}

async function getGoogleFileContent(token, fileId) {
 const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
  headers: { 'Authorization': `Bearer ${token}` }
 });
 if (!r.ok) throw new Error('تعذر تحميل محتوى الملف من جوجل درايف');
 return await r.json();
}

async function updateGoogleFile(token, fileId, content) {
 const r = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
  method: 'PATCH',
  headers: {
   'Authorization': `Bearer ${token}`,
   'Content-Type': 'application/json'
  },
  body: JSON.stringify(content)
 });
 if (!r.ok) throw new Error('تعذر تحديث الملف في جوجل درايف');
 return await r.json();
}

async function createGoogleFile(token, content) {
 const metadata = {
  name: 'yawmiyati_backup.json',
  mimeType: 'application/json'
 };
 const boundary = 'foo_bar_baz_boundary';
 const delimiter = `\r\n--${boundary}\r\n`;
 const closeDelimiter = `\r\n--${boundary}--`;
 const body = 
  delimiter +
  'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
  JSON.stringify(metadata) +
  delimiter +
  'Content-Type: application/json; charset=UTF-8\r\n\r\n' +
  JSON.stringify(content) +
  closeDelimiter;

 const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
  method: 'POST',
  headers: {
   'Authorization': `Bearer ${token}`,
   'Content-Type': `multipart/related; boundary=${boundary}`
  },
  body: body
 });
 if (!r.ok) throw new Error('تعذر إنشاء ملف جديد في جوجل درايف');
 return await r.json();
}

async function syncGoogleDrive(manual) {

  if (manual) toast('الرجاء إدخال معرف عميل Google Client ID أولاً في الإعدادات');
  return;

  if (manual) toast('جاري توجيهك لتسجيل الدخول بجوجل...');
  if (!tokenClient) initGoogle();
  if (tokenClient) {
   tokenClient.requestAccessToken({ prompt: manual ? 'consent' : '' });
  } else {
   toast('مكتبة Google غير متوفرة بعد، يرجى المحاولة بعد لحظات');
  }
  return;
 }
 if (manual) toast('جاري المزامنة مع Google Drive...');
 try {
  const file = await findGoogleFile(gToken);
  if (!S.lastUpdated) S.lastUpdated = Date.now();
  if (!file) {
   await createGoogleFile(gToken, S);
   toast('تم رفع نسخة احتياطية جديدة إلى Google Drive بنجاح');
  } else {
   const remoteDoc = await getGoogleFileContent(gToken, file.id);
   const remoteLastUpdated = remoteDoc.lastUpdated || 0;
   const localLastUpdated = S.lastUpdated || 0;
   if (remoteLastUpdated > localLastUpdated) {
    const newS = Object.assign({}, remoteDoc);
    S = Object.assign(S, newS);
    await window.storage.set(KEY, JSON.stringify(S));
    render();
    toast('تم تحميل البيانات الأحدث من Google Drive');
   } else if (localLastUpdated > remoteLastUpdated) {
    await updateGoogleFile(gToken, file.id, S);
    toast('تم تحديث النسخة الاحتياطية في Google Drive بنجاح');
   } else {
    if (manual) toast('البيانات متطابقة مع Google Drive بالفعل');
   }
  }
 } catch (err) {
  console.error(err);
  if (err.message && (err.message.includes('401') || err.message.includes('Unauthorized') || err.message.includes('token'))) {
   gToken = null;
   const statusEl = $('#g_status');
   if (statusEl) statusEl.textContent = 'غير متصل';
   if (manual) {
    toast('انتهت صلاحية تسجيل الدخول، يرجى إعادة المحاولة');
    syncGoogleDrive(true);
   }
  } else {
   toast(`فشلت مزامنة جوجل: ${err.message || err}`);
  }
 }
}

function learnNLP(note, cat) {
 if (!note || !cat || cat === 'أخرى') return;
 if (!S.nlpLearnt) S.nlpLearnt = {};
 const words = note.toLowerCase().split(' ').map(w => w.trim()).filter(w => w.length > 2);
 const stopWords = ['في', 'من', 'على', 'إلى', 'الى', 'عن', 'مع', 'حتى', 'أو', 'او', 'ثم', 'ال'];
 words.forEach(word => {
  let cleanWord = word;
  if (word.startsWith('ال') && word.length > 3) cleanWord = word.slice(2);
  if (!stopWords.includes(cleanWord) && isNaN(cleanWord)) {
   S.nlpLearnt[cleanWord] = cat;
  }
 });
}

function learnTask(title, pri, color) {
 if (!title) return;
 if (!S.taskPrefs) S.taskPrefs = {};
 const words = title.toLowerCase().split(' ').map(w => w.trim()).filter(w => w.length > 2);
 words.forEach(word => {
  let cleanWord = word;
  if (word.startsWith('ال') && word.length > 3) cleanWord = word.slice(2);
  S.taskPrefs[cleanWord] = { pri, color };
 });
}

function parseQuick(s){
 s=s.trim();if(!s)return null;
 let date=today();
 let cleanStr=s;
 const dateMatch=s.match(/(البارحة|البارحه|أمس|امس|باجر|باچر|بكرة|بكره|غداً|غدا|اليوم)/);
 if(dateMatch){
  const dTerm=dateMatch[1];
  const targetDate=new Date();
  if(dTerm==='البارحة'||dTerm==='البارحه'||dTerm==='أمس'||dTerm==='امس') targetDate.setDate(targetDate.getDate()-1);
  else if(dTerm==='باجر'||dTerm==='باچر'||dTerm==='بكرة'||dTerm==='بكره'||dTerm==='غداً'||dTerm==='غدا') targetDate.setDate(targetDate.getDate()+1);
  date=key(targetDate);
  cleanStr=cleanStr.replace(dTerm,' ');
 }
 const daysMap={'أحد':0,'اثنين':1,'ثلاثاء':2,'أربعاء':3,'خميس':4,'جمعة':5,'سبت':6,
               'الاحد':0,'الاثنين':1,'الثلاثاء':2,'الاربعاء':3,'الخميس':4,'الجمعة':5,'السبت':6};
 const dayMatch=s.match(/(الاحد|الاثنين|الثلاثاء|الاربعاء|الخميس|الجمعة|السبت|أحد|اثنين|ثلاثاء|أربعاء|خميس|جمعة|سبت)/);
 if(dayMatch){
  const dayName=dayMatch[1];
  const targetDay=daysMap[dayName];
  if(targetDay!==undefined){
   const todayDay=new Date().getDay();
   let diff=targetDay-todayDay;
   if(diff<=0) diff+=7;
   const targetDate=new Date();
   targetDate.setDate(targetDate.getDate()+diff);
   date=key(targetDate);
   cleanStr=cleanStr.replace(dayName,' ');

const pk=(t,d)=>t.rep==='daily'||t.rep==='every'?key(d||new Date()):t.rep==='weekly'?wkey(d||new Date()):t.rep==='monthly'?mkey(d||new Date()):'once';
const isDone=(t,d)=>!!(S.log[t.id]&&S.log[t.id][pk(t,d)]);
function toggle(t,dk){const k=pk(t,dk?parseK(dk):null);S.log[t.id]=S.log[t.id]||{};S.log[t.id][k]=!S.log[t.id][k];save();}
function streak(t){if(t.rep!=='daily')return Object.values(S.log[t.id]||{}).filter(Boolean).length;
 let n=0,d=new Date();while(S.log[t.id]&&S.log[t.id][key(d)]){n++;d.setDate(d.getDate()-1);}return n;}
function dueOn(t,d){if(t.rep==='once')return t.date===key(d);
 if(t.cr&&key(d)<t.cr)return false;
 if(t.rep==='every'){const n=+t.n||1,from=parseK(t.from||t.cr||key(d));
  const diff=Math.round((parseK(key(d))-from)/86400000);
  return diff>=0&&diff%n===0;}
 if(t.rep==='weekly')return t.wd==null||t.wd===d.getDay();
 if(t.rep==='monthly')return t.md==null||t.md===d.getDate();return true;}
const dayTasks=d=>S.tasks.filter(t=>dueOn(t,d||new Date()));
const overdue=()=>S.tasks.filter(t=>t.rep==='once'&&t.date<today()&&!isDone(t));
const habStreak=h=>{let n=0,d=new Date();while(S.hlog[h.id]&&S.hlog[h.id][key(d)]){n++;d.setDate(d.getDate()-1);}return n;};
const focusToday=()=>S.focus.filter(f=>f.date===today()).reduce((a,f)=>a+f.min,0);

/* ---------- time tracking ---------- */
const ACTS=[['نوم','#3B5068','☾'],['عمل','#2F4640','▣'],['دراسة','#5A6B4A','✍'],['تصفّح','#9E4A3E','▭'],
 ['أكل','#B08B3F','◍'],['تنقّل','#6B5B7B','⇄'],['رياضة','#3A6B54','▲'],['عبادة','#4A6B6B','✦'],
 ['عائلة','#8B6B4A','♡'],['ترفيه','#7B5B5B','♪'],['أخرى','#8B8F87','·']];
const TCOL=['#2F4640','#3A6B54','#9E4A3E','#B08B3F','#3B5068','#6B5B7B','#8B6B4A','#5A6B4A'];
const allActs=()=>ACTS.concat((S.xacts||[]).map(a=>[a.name,a.color,'◆']));
const actCol=a=>(allActs().find(x=>x[0]===a)||['','#8B8F87'])[1];
const actGoal=a=>+(S.actGoals&&S.actGoals[a])||0;
function actsWithData(N){const from=new Date();from.setDate(from.getDate()-(N-1));const fk=key(from);
 const m={};S.time.filter(t=>t.date>=fk).forEach(t=>m[t.act]=(m[t.act]||0)+t.min);
 return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);}
const dayMin=k=>S.time.filter(t=>t.date===k).reduce((a,t)=>a+t.min,0);
function dayBreak(k){const m={};S.time.filter(t=>t.date===k).forEach(t=>m[t.act]=(m[t.act]||0)+t.min);
 return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function rangeBreak(n){const m={},from=new Date();from.setDate(from.getDate()-(n-1));const fk=key(from);
 S.time.filter(t=>t.date>=fk).forEach(t=>m[t.act]=(m[t.act]||0)+t.min);
 return Object.entries(m).sort((a,b)=>b[1]-a[1]);}
function daysWithData(n){const s=new Set(),from=new Date();from.setDate(from.getDate()-(n-1));const fk=key(from);
 S.time.filter(t=>t.date>=fk).forEach(t=>s.add(t.date));return s.size||1;}
const hm=m=>{const h=Math.floor(m/60),r=Math.round(m%60);return h?(h+' س'+(r?' '+r+' د':'')):(r+' د');};
const runMin=()=>S.run?Math.max(0,Math.round((Date.now()-S.run.t0)/60000)):0;
function stopRun(){if(!S.run)return;const m=runMin();
 if(m>0)S.time.push({id:Date.now(),date:key(new Date(S.run.t0)),act:S.run.act,min:m,note:'مؤقّت'});
 const a=S.run.act;S.run=null;save();render();toast('سُجّلت '+hm(m)+' — '+a);}

/* ---------- reminders ---------- */
const OFFS=[[0,'عند الموعد'],[5,'٥ د'],[15,'١٥ د'],[30,'٣٠ د'],[60,'ساعة'],[120,'ساعتان'],
 [180,'٣ ساعات'],[360,'٦ ساعات'],[720,'١٢ ساعة'],[1440,'يوم'],[2880,'يومان'],[10080,'أسبوع']];
const offLabel=m=>{const f=OFFS.find(o=>o[0]===m);if(f)return m?('قبل '+f[1]):f[1];
 return m%1440===0?('قبل '+(m/1440)+' يوم'):m%60===0?('قبل '+(m/60)+' ساعة'):('قبل '+m+' دقيقة');};
function buildReminders(t){
 const offs=(t.rem||[]).slice().sort((a,b)=>b-a);
 if(!t.time||!offs.length)return 0;
 let made=0;
 offs.forEach(off=>{
  const lbl=(off?'تذكير — ':'')+t.title+(off?' ('+offLabel(off)+')':'');
  if(t.rep==='once'){
   const dt=new Date(t.date+'T'+t.time+':00');
   dt.setMinutes(dt.getMinutes()-off);
   if(dt.getTime()<Date.now()-60000)return;              // موعد فات: لا تذكير
   S.alarms.push({id:Date.now()+Math.random(),time:pad(dt.getHours())+':'+pad(dt.getMinutes()),
    once:key(dt),label:lbl,type:'mix',n:1,lv:1,mode:'easy',snd:t.remSnd||'calm',on:true,days:[],tsk:t.id,off});
   made++;
  }else{
   if(off>=1440)return;                                   // تكرار يومي/أسبوعي: لا معنى ليوم كامل
   const [H,M]=t.time.split(':').map(Number);
   const mins=H*60+M-off;
   if(mins<0)return;                                      // يقع في اليوم السابق: نتخطّاه
   S.alarms.push({id:Date.now()+Math.random(),time:pad(Math.floor(mins/60))+':'+pad(mins%60),
    label:lbl,type:'mix',n:1,lv:1,mode:'easy',snd:t.remSnd||'calm',on:true,
    days:t.rep==='weekly'&&t.wd!=null?[t.wd]:[],tsk:t.id,off});
   made++;
  }});
 return made;}
const dropReminders=id=>{const n=S.alarms.filter(a=>a.tsk===id).length;
 S.alarms=S.alarms.filter(a=>a.tsk!==id);return n;};

/* ---------- automation engine ---------- */
function alog(msg){S.autolog.unshift({d:today(),t:nowHM(),m:msg});
 if(S.autolog.length>40)S.autolog=S.autolog.slice(0,40);}
function autoRun(){
 const before=S.autolog.length;
 // 1. a timer left running overnight is capped at 12h instead of inflating the day
 if(S.set.autoTimer&&S.run){const mins=Math.round((Date.now()-S.run.t0)/60000);
  if(mins>720){S.time.push({id:Date.now(),date:key(new Date(S.run.t0)),act:S.run.act,min:720,note:'أُغلق تلقائياً'});
   alog('أُغلق مؤقّت «'+S.run.act+'» بعد ١٢ ساعة وسُجّل');S.run=null;}}
 // 2. overdue scheduled tasks move to today rather than rotting in the past
 if(S.set.autoRoll){const od=overdue();
  if(od.length){od.forEach(t=>{t.date=today();});
   alog('نُقلت '+od.length+' مهمة متأخّرة إلى اليوم');}}
 // 3. a new month inherits last month's budget so you never start blind
 if(S.set.autoBudget){const mk=mkey(new Date());
  if(!S.budgets[mk]){const pv=new Date();pv.setMonth(pv.getMonth()-1);
   const old=S.budgets[mkey(pv)];
   if(old&&Object.keys(old).length){S.budgets[mk]=Object.assign({},old);
    alog('نُقلت ميزانية الشهر الماضي إلى '+AR_M[new Date().getMonth()]);}}}
 // 4. backup nudge every two weeks
 if(S.set.autoBackup){const last=S.lastBackup?Math.round((Date.now()-parseK(S.lastBackup))/86400000):999;
  if(last>=14&&S.tx.length>5){setTimeout(()=>toast('مرّ أسبوعان بلا نسخة احتياطية — الإعدادات ← نسخة احتياطية'),1400);
   S.lastBackup=today();alog('تذكير بالنسخة الاحتياطية');}}
 if(S.autolog.length>before)save();}
function weekStats(){
 const from=new Date();from.setDate(from.getDate()-6);const fk=key(from);
 const tx=S.tx.filter(t=>t.date>=fk&&!t.tr);
 const out=tx.filter(t=>t.k==='out').reduce((a,t)=>a+t.amt,0);
 const inc=tx.filter(t=>t.k==='in').reduce((a,t)=>a+t.amt,0);
 let tt=0,td=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);
  dayTasks(d).forEach(t=>{tt++;if(isDone(t,d))td++;});}
 const tb=rangeBreak(7),dwd=daysWithData(7);
 const sleep=(tb.find(x=>x[0]==='نوم')||[0,0])[1]/dwd;
 const top=tb[0]?tb[0][0]:null;
 return{out,inc,tt,td,sleep,top,net:inc-out};}

/* ---------- donut chart ---------- */
function donut(data,cap){
 const tot=data.reduce((a,d)=>a+d[1],0);
 if(!tot)return empt('لا بيانات');
 const R1=52,C=2*Math.PI*R1;let off=0;
 const segs=data.map(([l,v,c])=>{const len=v/tot*C,s=`<circle cx="70" cy="70" r="${R1}" fill="none" stroke="${c}"
  stroke-width="17" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s;}).join('');
 return `<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap">
  <svg viewBox="0 0 140 140" style="width:140px;flex:none">${segs}
   <text x="70" y="66" text-anchor="middle" font-size="9.5" fill="#8B8F87" font-family="IBM Plex Sans Arabic">${cap||''}</text>
   <text x="70" y="83" text-anchor="middle" font-size="15" fill="currentColor" font-family="IBM Plex Sans Arabic">${data.length}</text></svg>
  <div style="flex:1;min-width:150px">${data.map(([l,v,c])=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px">
   <i style="width:8px;height:8px;border-radius:2px;background:${c};display:block;flex:none"></i>
   <span style="color:var(--mut);font-weight:300">${l}</span>
   <b style="margin-inline-start:auto;font-weight:500;font-variant-numeric:tabular-nums">${Math.round(v/tot*100)}٪</b></div>`).join('')}</div></div>`;
}
const PIE=['#2F4640','#9E4A3E','#3A6B54','#B08B3F','#3B5068','#6B5B7B','#5A6B4A','#8B6B4A'];
function topSlices(pairs,n){
 const top=pairs.slice(0,n).map(([l,v],i)=>[l,v,PIE[i%PIE.length]]);
 const rest=pairs.slice(n).reduce((a,p)=>a+p[1],0);
 if(rest>0)top.push(['أخرى',rest,'#B7BDB4']);
 return top;}

/* ---- INSIGHTS ---- */
function insights(){
 const st=mstats(cursor),pv=new Date(cursor.getFullYear(),cursor.getMonth()-1,1),ps=mstats(pv);
 const exp=byCat(st.list,'out'),inc=byCat(st.list,'in'),O=[];
 const days=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
 if(exp.length&&exp[0][1]/st.out>=.35)O.push(['◉',`<b>${exp[0][0]}</b> وحده يبتلع ${Math.round(exp[0][1]/st.out*100)}٪ من مصروفك. تقليصه بالربع يوفّر ${fmt(exp[0][1]*.25)}.`]);
 const wd=[0,0,0,0,0,0,0];st.list.filter(t=>t.k==='out').forEach(t=>wd[parseK(t.date).getDay()]+=t.amt);
 const mw=Math.max(...wd);if(mw>0&&mw>st.out/7*1.6)O.push(['◈',`ذروة صرفك يوم <b>${AR_D[wd.indexOf(mw)]}</b> — أعلى بـ ${Math.round((mw/(st.out/7)-1)*100)}٪ من متوسط اليوم.`]);
 if(ps.out&&st.out>ps.out*1.15)O.push(['▲',`صرفت أكثر من الشهر الماضي بـ <b>${Math.round((st.out/ps.out-1)*100)}٪</b>.`]);
 if(ps.out&&st.out<ps.out*.9)O.push(['▼',`وفّرت <b>${Math.round((1-st.out/ps.out)*100)}٪</b> مقارنة بالشهر الماضي.`]);
 if(st.inc&&st.net<0)O.push(['!',`صرفك تجاوز دخلك بـ <b>${fmt(-st.net)}</b> هذا الشهر.`]);
 else if(st.inc)O.push(['✓',`نسبة ادّخارك <b>${Math.round(st.net/st.inc*100)}٪</b> من الدخل.`]);
 if(inc.length===1&&st.inc)O.push(['◐',`كل دخلك من مصدر واحد (<b>${inc[0][0]}</b>) — تنويعه يقلّل المخاطرة.`]);
 const big=[...st.list].filter(t=>t.k==='out').sort((a,b)=>b.amt-a.amt)[0];
 if(big&&st.out&&big.amt/st.out>.2)O.push(['◆',`أكبر حركة واحدة: <b>${fmt(big.amt)}</b> في ${big.cat} — ${Math.round(big.amt/st.out*100)}٪ من الشهر.`]);
 const od=S.debts.filter(d=>!d.paid&&d.due&&d.due<today());
 if(od.length)O.push(['⌛',`<b>${od.length}</b> دين تجاوز موعد تسويته.`]);
 let tt=0,td=0;for(let i=0;i<days;i++){const d=new Date(cursor.getFullYear(),cursor.getMonth(),i+1);if(d>new Date())break;
  dayTasks(d).forEach(t=>{tt++;if(isDone(t,d))td++;});}
 if(tt)O.push([td/tt>=.7?'✓':'○',`أنجزت <b>${Math.round(td/tt*100)}٪</b> من مهامك المستحقة (${td}/${tt}).`]);
 const bh=S.habits.map(h=>({h,s:habStreak(h)})).sort((a,b)=>b.s-a.s)[0];
 if(bh&&bh.s>2)O.push(['✦',`أطول سلسلة عادات: <b>${esc(bh.h.title)}</b> — ${bh.s} يوماً متتالياً.`]);
 const b=S.budgets[mkey(cursor)]||{},sp={};st.list.filter(t=>t.k==='out').forEach(t=>sp[t.cat]=(sp[t.cat]||0)+t.amt);
 Object.keys(b).forEach(c=>{if((sp[c]||0)>b[c])O.push(['!',`تجاوزت ميزانية <b>${c}</b> بـ ${fmt(sp[c]-b[c])}.`]);});
 const f=S.focus.filter(x=>x.date.slice(0,7)===mkey(cursor)).reduce((a,x)=>a+x.min,0);
 if(f)O.push(['◷',`سجّلت <b>${f}</b> دقيقة تركيز هذا الشهر.`]);
 const dwd=daysWithData(14),tb=rangeBreak(14);
 if(tb.length){
  const sl=(tb.find(x=>x[0]==='نوم')||[0,0])[1]/dwd,sc=(tb.find(x=>x[0]==='تصفّح')||[0,0])[1]/dwd,
   wk=(tb.find(x=>x[0]==='عمل')||[0,0])[1]/dwd,tt=tb.reduce((a,x)=>a+x[1],0)/dwd;
  if(sl&&sl<420)O.push(['☾',`متوسط نومك <b>${hm(sl)}</b> — أقل من سبع ساعات.`]);
  else if(sl>=420)O.push(['☾',`متوسط نومك <b>${hm(sl)}</b> — ضمن المعدّل الصحّي.`]);
  if(sc&&sc>=120)O.push(['▭',`التصفّح يأخذ <b>${hm(sc)}</b> يومياً — ${Math.round(sc/1440*100)}٪ من وقتك، أي نحو ${hm(sc*30)} شهرياً.`]);
  if(wk&&sc&&sc>wk*0.5)O.push(['◐',`وقت التصفّح يعادل <b>${Math.round(sc/wk*100)}٪</b> من وقت عملك.`]);
  O.push(['◔',`توثّق <b>${hm(tt)}</b> من أصل ٢٤ ساعة يومياً — ${Math.round(tt/1440*100)}٪ من يومك.`]);
  if(tb[0])O.push(['▣',`أكثر ما يستهلك وقتك: <b>${tb[0][0]}</b> بمعدّل ${hm(tb[0][1]/dwd)} يومياً.`]);}
 return O.length?O:[['·','سجّل حركات ومهام أكثر لتظهر ملاحظات دقيقة عن سلوكك.']];
}

function searchAll(){
 if(schq.length<2)return `<div class="empty">اكتب حرفين على الأقل</div>`;
 const q=schq,out=[];
 S.tx.filter(t=>(t.cat+' '+(t.note||'')).includes(q)).slice(0,8).forEach(t=>
  out.push(`<div class="row"><div class="glyph">${gl(t.cat)}</div><div><div class="t">${esc(t.cat)}</div>
   <div class="s">${dayLabel(t.date)} ${esc(t.note)}</div></div><div class="amt num">${fmt(t.amt)}</div></div>`));
 S.tasks.filter(t=>(t.title+' '+(t.note||'')).includes(q)).slice(0,8).forEach(t=>
  out.push(`<div class="row"><div class="glyph">✓</div><div><div class="t">${esc(t.title)}</div><div class="s">مهمة</div></div></div>`));
 S.debts.filter(d=>(d.who+' '+(d.note||'')).includes(q)).slice(0,6).forEach(d=>
  out.push(`<div class="row"><div class="glyph">${d.k==='lent'?'↗':'↙'}</div><div><div class="t">${esc(d.who)}</div>
   <div class="s">دين</div></div><div class="amt num">${fmt(d.amt)}</div></div>`));
 Object.keys(S.notes).filter(k=>S.notes[k].includes(q)).slice(0,6).forEach(k=>
  out.push(`<div class="row"><div class="glyph">✎</div><div><div class="t">${dayLabel(k)}</div>
   <div class="s">${esc(S.notes[k].slice(0,60))}</div></div></div>`));
 return out.length?out.join(''):`<div class="empty">لا نتائج</div>`;
}

 return{kind:'input',q:`(${a}² × ${b}) + (${c} × ${a}) − ${b} = ؟`,ans:String(a*a*b+c*a-b)};}

const cLogic=()=>{const p=PUZ[Math.floor(Math.random()*PUZ.length)];return{kind:'choice',q:p.q,opts:p.o,ans:p.a};};
function poly(n,rot,fill,dots){let pts='';
 for(let i=0;i<n;i++){const a=(i/n*360+rot-90)*Math.PI/180;pts+=`${40+28*Math.cos(a)},${40+28*Math.sin(a)} `;}
 let d='';for(let i=0;i<dots;i++)d+=`<circle cx="${24+i*11}" cy="40" r="2.8" fill="#1D1F1C"/>`;
 return `<svg viewBox="0 0 80 80" width="100%" style="max-width:64px"><polygon points="${pts}" fill="${fill}" stroke="#1D1F1C" stroke-width="1.6" stroke-linejoin="round"/>${d}</svg>`;}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function cMatrix(L){
 const base=3+Math.floor(Math.random()*2),step=L>2?2:1,rot=[0,30,45,60][Math.floor(Math.random()*4)];
 const C=['#E7E9E3','#B7C6BC','#3A6B54'],cells=[];
 for(let r=0;r<3;r++)for(let c=0;c<3;c++){if(r===2&&c===2){cells.push(null);continue;}
  cells.push({n:base+c*step,rot:rot*r,fill:C[c],dots:r+1});}
 const right={n:base+2*step,rot:rot*2,fill:C[2],dots:3};
 const wrong=[{n:base+2*step,rot:rot*2,fill:C[1],dots:3},{n:base+step,rot:rot*2,fill:C[2],dots:2}];
 const o=shuffle([{v:right,ok:1},...wrong.map(w=>({v:w,ok:0}))]);
 const grid=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px">
  ${cells.map(c=>c?`<div style="border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;place-items:center">${poly(c.n,c.rot,c.fill,c.dots)}</div>`
  :`<div style="border:1px dashed var(--exp);border-radius:8px;display:grid;place-items:center;font-size:22px;color:var(--exp);min-height:64px">؟</div>`).join('')}</div>`;
 return{kind:'svg',q:'أكمل المصفوفة',grid,opts:o.map(x=>poly(x.v.n,x.v.rot,x.v.fill,x.v.dots)),ans:o.findIndex(x=>x.ok)};}
function cOdd(){const n=4+Math.floor(Math.random()*3),f='#B7C6BC';
 const same=[{n,rot:0,fill:f,dots:2},{n,rot:45,fill:f,dots:2}],odd={n:n+1,rot:20,fill:f,dots:2};
 const o=shuffle([{v:odd,ok:1},...same.map(s=>({v:s,ok:0}))]);
 return{kind:'svg',q:'أيّ شكل يخالف القاعدة المشتركة؟',grid:'',opts:o.map(x=>poly(x.v.n,x.v.rot,x.v.fill,x.v.dots)),ans:o.findIndex(x=>x.ok)};}
function cAnalogy(){const n=3+Math.floor(Math.random()*3),rot=45;
 const A=poly(n,0,'#E7E9E3',1),B=poly(n,rot,'#E7E9E3',2),C=poly(n+1,0,'#B7C6BC',1);
 const right={n:n+1,rot,fill:'#B7C6BC',dots:2};
 const wrong=[{n:n+1,rot:0,fill:'#B7C6BC',dots:2},{n:n+1,rot,fill:'#B7C6BC',dots:1}];
 const o=shuffle([{v:right,ok:1},...wrong.map(w=>({v:w,ok:0}))]);
 const bx=s=>`<div style="border:1px solid var(--line);border-radius:8px;padding:5px">${s}</div>`;
 const grid=`<div style="display:flex;align-items:center;justify-content:center;gap:7px;margin-bottom:14px;flex-wrap:wrap">
  ${bx(A)}<span style="color:var(--mut)">→</span>${bx(B)}<span style="color:var(--mut);margin:0 5px">::</span>${bx(C)}
  <span style="color:var(--mut)">→</span>
  <div style="border:1px dashed var(--exp);border-radius:8px;width:60px;height:60px;display:grid;place-items:center;font-size:20px;color:var(--exp)">؟</div></div>`;
 return{kind:'svg',q:'أكمل القياس',grid,opts:o.map(x=>poly(x.v.n,x.v.rot,x.v.fill,x.v.dots)),ans:o.findIndex(x=>x.ok)};}
function cMemory(L){const len=4+Math.min(L,3);let d='';for(let i=0;i<len;i++)d+=Math.floor(Math.random()*10);
 return{kind:'mem',digits:d,q:'احفظ الأرقام'};}
function makeCh(type,L,mode){
 if(mode==='easy')return makeEasy(type);
 const t=type==='mix'?['math','logic','iq','iq','mem'][Math.floor(Math.random()*5)]:type;
 if(t==='math')return cMath(L);if(t==='logic')return cLogic();if(t==='mem')return cMemory(L);
 return [cMatrix,cOdd,cAnalogy][Math.floor(Math.random()*3)](L);}

/* ================= RINGING ================= */
let ring=null,ac=null,osc=null,osc2=null,vT=null,bT=null,cT=null,wake=null,chT=null,memIv=null;
let TONE=null,TONEEL=null,PREV=null;
const TCACHE={};
async function loadTone(id){
 if(id==='legacy')return TONE;
 if(TCACHE[id])return TCACHE[id];
 try{const r=await window.storage.get('yawmiyati:tone:'+id);
  if(r&&r.value&&r.value.length>100){TCACHE[id]=r.value;return r.value;}}catch(e){}
 return null;}
async function saveTone(name,dataUrl){
 const id='t'+Date.now();
 await window.storage.set('yawmiyati:tone:'+id,dataUrl);
 TCACHE[id]=dataUrl;S.tones.push({id,name});save();return id;}
async function dropTone(id){
 try{await window.storage.set('yawmiyati:tone:'+id,'');}catch(e){}
 delete TCACHE[id];
 S.tones=S.tones.filter(t=>t.id!==id);
 if(id==='legacy'){TONE=null;try{await window.storage.set('yawmiyati:tone','');}catch(e){}}
 S.alarms.forEach(a=>{if(a.snd==='tone:'+id)a.snd='calm';});
 save();}
const toneName=id=>{const t=(S.tones||[]).find(x=>x.id===id);return t?t.name:'نغمة';};
function calmOn(){
 // original gentle phrase — soft sine bells in 3/4, volume creeps up so it still wakes you
 try{
  ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const master=ac.createGain();master.gain.value=1;master.connect(ac.destination);
  const N=[440,523.25,659.25,587.33,523.25,493.88,440,392,349.23,392,440,329.63];
  let i=0,vol=.05;
  const play=()=>{if(!ac)return;
   vol=Math.min(.34,vol+.004);
   const t=ac.currentTime;
   [0,1].forEach(layer=>{
    const o=ac.createOscillator();o.type=layer?'triangle':'sine';
    o.frequency.value=N[i%N.length]*(layer?2:1);
    const g=ac.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol*(layer?.22:1)),t+.09);
    g.gain.exponentialRampToValueAtTime(.0001,t+.95);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+1.05);});
   i++;};
  bT=setInterval(play,620);play();
 }catch(e){}}
function toneOn(src){
 try{TONEEL=new Audio(src);TONEEL.loop=true;TONEEL.volume=.35;
  const up=setInterval(()=>{if(!TONEEL)return clearInterval(up);
   TONEEL.volume=Math.min(1,TONEEL.volume+.03);},4000);
  TONEEL.play().catch(()=>{$('#au').classList.add('on');});}catch(e){}}
function noiseOn(mode){
 if(mode&&mode.indexOf('tone:')===0){
  const tid=mode.slice(5);
  if(S.set.sound)loadTone(tid).then(src=>{if(!ring)return;if(src)toneOn(src);else calmOn();});
  if(S.set.vib&&navigator.vibrate){vT=setInterval(()=>navigator.vibrate([400,200,400]),3200);navigator.vibrate([400,200,400]);}
  $('#ring').classList.add('soft');
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}
  return;}
 if(mode==='calm'){
  if(S.set.sound){if(TONE)toneOn(TONE);else calmOn();}
  if(S.set.vib&&navigator.vibrate){vT=setInterval(()=>navigator.vibrate([180]),6000);navigator.vibrate([180]);}
  $('#ring').classList.add('soft');
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}
  return;}
 if(S.set.sound)try{
  ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  const master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
  const comp=ac.createDynamicsCompressor?ac.createDynamicsCompressor():null;
  if(comp){master.disconnect();master.connect(comp);comp.connect(ac.destination);}
  osc=ac.createOscillator();osc.type='square';osc.frequency.value=740;osc.connect(master);osc.start();
  osc2=ac.createOscillator();osc2.type='sawtooth';osc2.frequency.value=494;
  const g2=ac.createGain();g2.gain.value=.55;osc2.connect(g2);g2.connect(master);osc2.start();
  let up=true,vol=.22,beat=300,t=0;
  const pulse=()=>{if(!ac)return;
   t++;vol=Math.min(.85,vol+.02);
   if(t>28&&beat>150){beat=Math.max(150,beat-12);clearInterval(bT);bT=setInterval(pulse,beat);}
   master.gain.setTargetAtTime(up?vol:.0005,ac.currentTime,.012);
   const hi=t>28;
   osc.frequency.setTargetAtTime(up?(hi?1180:960):(hi?720:600),ac.currentTime,.012);
   osc2.frequency.setTargetAtTime(up?(hi?590:494):(hi?370:330),ac.currentTime,.012);
   up=!up;};
  bT=setInterval(pulse,beat);pulse();
 }catch(e){}
 if(S.set.vib&&navigator.vibrate){const P=[700,120,700,120,1100,200];
  vT=setInterval(()=>navigator.vibrate(P),2900);navigator.vibrate(P);}
 $('#ring').classList.add('hot');
 try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{});}catch(e){}}
function noiseOff(){clearInterval(bT);clearInterval(vT);clearInterval(cT);clearTimeout(chT);clearInterval(memIv);
 if(navigator.vibrate)navigator.vibrate(0);
 try{if(TONEEL){TONEEL.pause();TONEEL.currentTime=0;TONEEL=null;}}catch(e){}
 $('#ring').classList.remove('hot');$('#ring').classList.remove('soft');
 try{if(osc)osc.stop();if(osc2)osc2.stop();if(ac)ac.close();if(wake)wake.release();}catch(e){}ac=osc=osc2=wake=null;}
function ringNow(a){
 ring={a,need:a.n||1,got:0,L:a.lv||2,mode:a.mode||'hard',t0:Date.now()};
 S.stats.rings++;save();
 $('#ringLbl').textContent=a.label||'حان الوقت';
 const tick=()=>{const d=new Date();$('#ringClock').textContent=pad(d.getHours())+':'+pad(d.getMinutes());};
 tick();cT=setInterval(tick,1000);
 $('#ring').classList.add('on');noiseOn(a.snd||'loud');
 setTimeout(()=>{if(ring&&S.set.sound&&(!ac||ac.state==='suspended'))$('#au').classList.add('on');},400);
 if(S.set.notify&&'Notification' in window&&Notification.permission==='granted')
  try{new Notification('⏰ '+(a.label||'منبه'),{body:'حلّ التحدي داخل التطبيق لإيقافه',requireInteraction:true});}catch(e){}
 nextCh();}
const lvlBar=()=>{$('#ringLvl').innerHTML=ring.mode==='easy'?'':[1,2,3,4].map(i=>`<i class="${i<=ring.L?'f':''}"></i>`).join('');};
function nextCh(){
 if(!ring)return;clearInterval(memIv);
 const c=makeCh(ring.a.type||'mix',ring.L,ring.mode);ring.ch=c;lvlBar();
 $('#ringProg').textContent=ring.need>1?`التحدي ${ring.got+1} من ${ring.need}`:'';
 const b=$('#ringBox');
 if(c.kind==='input'){
  b.innerHTML=`<div class="q">${c.q}</div><input id="ch_in" type="number" inputmode="numeric" placeholder="الإجابة" style="text-align:center;font-size:19px">
   <button class="btn" id="ch_ok">تحقّق</button>`;
  $('#ch_ok').onclick=()=>judge($('#ch_in').value.trim()===c.ans);
 }else if(c.kind==='choice'){
  b.innerHTML=`<div style="font-size:14px;font-weight:400;line-height:1.95;margin-bottom:16px">${c.q}</div>
   ${c.opts.map((o,i)=>`<button class="opt" data-o="${i}">${o}</button>`).join('')}`;
  b.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>judge(+x.dataset.o===c.ans));
 }else if(c.kind==='mem'){
  b.innerHTML=`<div style="font-size:13px;text-align:center;color:var(--mut);margin-bottom:8px">احفظ هذه الأرقام</div>
   <div class="q" id="memD" style="font-size:32px;letter-spacing:10px">${c.digits}</div>
   <div style="text-align:center;font-size:11.5px;color:var(--mut)" id="memT">تختفي بعد ${c.secs||4} ثوانٍ</div>`;
  let n=c.secs||4;memIv=setInterval(()=>{if(!ring)return clearInterval(memIv);
   n--;const t=$('#memT');if(t)t.textContent='تختفي بعد '+n;
   if(n<=0){clearInterval(memIv);if(!$('#memD'))return;
    b.innerHTML=`<div class="q">اكتب الأرقام بالترتيب</div>
     <input id="ch_in" type="number" inputmode="numeric" style="text-align:center;font-size:21px;letter-spacing:8px">
     <button class="btn" id="ch_ok">تحقّق</button>`;
    $('#ch_ok').onclick=()=>judge($('#ch_in').value.trim()===c.digits);}},1000);
 }else{
  b.innerHTML=`<div style="font-size:14px;margin-bottom:14px;text-align:center">${c.q}</div>${c.grid}
   <div class="og">${c.opts.map((s,i)=>`<button class="opt sv" data-o="${i}">${s}</button>`).join('')}</div>`;
  b.querySelectorAll('[data-o]').forEach(x=>x.onclick=()=>judge(+x.dataset.o===c.ans));}}
function judge(ok){
 if(!ring)return;const b=$('#ringBox');
 if(!ok){S.stats.failed++;save();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),380);
  if(navigator.vibrate&&S.set.vib)navigator.vibrate([90,60,90]);
  if(ring.mode!=='easy')ring.L=Math.min(4,ring.L+1);chT=setTimeout(nextCh,420);return;}
 S.stats.solved++;ring.got++;save();
 if(ring.got>=ring.need){
  const sec=Math.round((Date.now()-ring.t0)/1000),a=ring.a;
  noiseOff();$('#ring').classList.remove('on');ring=null;
  if(!a.test){S.wake.push({date:today(),sec});if(S.wake.length>60)S.wake=S.wake.slice(-60);}
  if(a.once){const x=S.alarms.find(z=>z.id===a.id);if(x)x.on=false;}
  save();
  const w=S.wx&&!S.wx.fail?` · ${S.wx.t}° ${wxOf(S.wx.c)[0]}`:'';
  toast(a.test?`أحسنت — ${sec} ثانية`:`صباح الخير — ${sec} ثانية${w}`);
  render();
 }else chT=setTimeout(nextCh,300);}

/* ================= ENGINE ================= */
let fired={};
function dueAlarms(){
 if(!ready||ring)return;
 const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),st=key(n)+' ';
 S.alarms.forEach(a=>{
  if(!a.on)return;
  if(a.once&&a.once!==key(n))return;
  if(a.days&&a.days.length&&!a.days.includes(n.getDay()))return;
  if(fired[a.id+st+a.time])return;
  if(a.time===hm||(a.time<hm&&S.lastOpen!==key(n))){fired[a.id+st+a.time]=1;ringNow(a);}});}
setInterval(()=>{dueAlarms();
 if(ready&&S.lastOpen&&S.lastOpen!==today()){S.lastOpen=today();autoRun();render();save();}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){dueAlarms();fetchWx();
 if(TIP&&TIP._d!==today()){TIP=null;fetchTip();}}});

/* ================= LOCK ================= */
let buf='';
const drawPins=()=>$('#pins').innerHTML=Array.from({length:4},(_,i)=>`<i class="${i<buf.length?'f':''}"></i>`).join('');
function buildPad(){$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(n=>n===''?'<span></span>':`<button data-p="${n}">${n}</button>`).join('');
 $$('#pad [data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;
  if(p==='⌫'){buf=buf.slice(0,-1);return drawPins();}
  buf+=p;drawPins();
  if(buf.length===4){if(buf===S.set.pin)$('#lock').classList.remove('on');
   else{buf='';drawPins();$('#pad').classList.add('shake');setTimeout(()=>$('#pad').classList.remove('shake'),400);}}});}

/* ================= BOOT ================= */
$$('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.t;render();});
$('#fab').onclick=()=>{if(view==='tasks')return sub.tasks==='hab'?shHabit():sub.tasks==='time'?shTime():shTask();
 if(view==='alarm')return shAlarm();
 if(view==='money')return({tx:shTx,acc:shAcc,bud:shBudget,debt:shDebt,goal:shGoal,wish:shWish,rec:shRec})[sub.money]();
 shTx();};

$('#schBtn').onclick=shSearch;
$('#themeBtn').onclick=()=>{S.set.dark=!S.set.dark;applyTheme();save();};

$('#au').onclick=()=>{$('#au').classList.remove('on');if(ring){noiseOff();noiseOn(ring.a.snd||'loud');}};
R.addEventListener('pointerdown',()=>{try{if(ac&&ac.state==='suspended')ac.resume();}catch(e){}},true);
setInterval(()=>{const e=$('#runEl');if(e&&S.run)e.textContent=hm(runMin())||'٠ د';},1000);

 if(S.set.syncUrl&&S.set.autoSync)syncCloud(false);
 if(S.set.googleClientId&&S.set.googleAutoSync)loadGoogleScript();
});
load().then(()=>{
 applyTheme();
 runRecurring();autoRun();ready=true;

 render();dueAlarms();fetchWx();fetchTip();

  else if(q==='tasks'){view='tasks';render();}

 }catch(e){}
});
window.handleAndroidBack=function(){
 const sheet=document.getElementById('sheet');
 if(sheet && sheet.classList.contains('on')){
  close();
  return true;
 }
 const ring=document.getElementById('ring');
 if(ring && ring.classList.contains('on')){
  return true;
 }
 if(typeof view !== 'undefined' && view !== 'home'){
  view = 'home';

 return false;

<script>
/* ============================================================
   ربط التطبيق بالنظام: التثبيت، العمل بلا إنترنت، وجدولة المنبّهات
   ============================================================ */
(function(){
/* 1) تسجيل الـService Worker */
if('serviceWorker' in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('./sw.js').then(reg=>{
   window.__swReg=reg;
   setTimeout(pushSchedule,1500);
  }).catch(()=>{});
 });
}

/* 2) حساب المواعيد القادمة (٤٨ ساعة) وإرسالها للـSW */
function nextTimes(a,hours){
 const out=[],now=Date.now();
 for(let d=0;d<=2;d++){
  const t=new Date();t.setDate(t.getDate()+d);
  const [H,M]=(a.time||'07:00').split(':').map(Number);
  t.setHours(H,M,0,0);
  const at=t.getTime();
  if(at<now||at>now+hours*3600e3)continue;
  if(a.once){const k=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
   if(a.once!==k)continue;}
  else if(a.days&&a.days.length&&!a.days.includes(t.getDay()))continue;
  out.push(at);
 }
 return out;
}
async function pushSchedule(){
 try{
  const reg=window.__swReg||await navigator.serviceWorker.ready;
  if(!reg||!reg.active)return;
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const raw=await window.storage.get('yawmiyati:v3').catch(()=>null);
  if(!raw||!raw.value)return;
  const S=JSON.parse(raw.value);
  const list=[];
  (S.alarms||[]).filter(a=>a.on).forEach(a=>{
   nextTimes(a,48).forEach(at=>list.push({id:a.id,label:a.label,at}));
  });
  reg.active.postMessage({type:'schedule',alarms:list.slice(0,30)});
 }catch(e){}
}
window.__pushSchedule=pushSchedule;
/* أعِد الجدولة عند كل عودة للتطبيق وكل ١٥ دقيقة */
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pushSchedule();});
setInterval(pushSchedule,15*60*1000);

/* 3) زر التثبيت */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;showInstall();});
function showInstall(){
 if(document.getElementById('instBar'))return;
 const b=document.createElement('div');
 b.id='instBar';
 b.style.cssText='position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:130;'+
  'background:#1D1F1C;color:#EFF0EC;padding:11px 16px;border-radius:9px;font-size:12.5px;'+
  "font-family:'IBM Plex Sans Arabic',sans-serif;display:flex;gap:14px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)";
  b.innerHTML='<span>ثبّت «مدبر المهام» على جهازك</span>'+
  '<button id="instGo" style="border:0;background:transparent;color:#B08B3F;font-weight:600;cursor:pointer;font-family:inherit">تثبيت</button>'+
  '<button id="instNo" style="border:0;background:transparent;color:#8B8F87;cursor:pointer;font-family:inherit">لاحقاً</button>';
 document.body.appendChild(b);
 document.getElementById('instGo').onclick=async()=>{b.remove();if(deferred){deferred.prompt();deferred=null;}};
 document.getElementById('instNo').onclick=()=>b.remove();
}
window.addEventListener('appinstalled',()=>{
 const b=document.getElementById('instBar');if(b)b.remove();
 if('Notification' in window&&Notification.permission==='default')Notification.requestPermission().then(pushSchedule);
});
})();

</script>

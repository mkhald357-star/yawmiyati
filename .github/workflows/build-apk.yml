name: بناء تطبيق أندرويد (Native APK & AAB)

on:
  workflow_dispatch:          # زر تشغيل يدوي من تبويب Actions
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write             # لإنشاء إصدار وإرفاق الـAPK به

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: مزامنة أصول الويب داخل مجلد الأندرويد
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html manifest.json sw.js icon-*.png android/app/src/main/assets/www/ || true

      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          PASS="${STORE_PASS:-yawmiyati2026}"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          cd android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "استخدام مفتاح التوقيع من Secrets"
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
          elif [ -f "android.keystore" ]; then
            echo "استخدام مفتاح التوقيع الموجود بالمشروع"
          else
            echo "إنشاء مفتاح توقيع جديد"
            keytool -genkeypair -v \
              -keystore android.keystore -alias yawmiyati \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Yawmiyati, OU=Personal, O=Yawmiyati, L=Mosul, C=IQ"
          fi
          base64 -w0 android.keystore > keystore-base64.txt || true

      - name: بناء تطبيق الأندرويد (APK & AAB)
        env:
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: تجهيز ملفات المخرجات
        run: |
          mkdir -p output
          find android/app/build/outputs/ -name "*.apk" -exec cp {} output/ \;
          find android/app/build/outputs/ -name "*.aab" -exec cp {} output/ \;
          cp android/keystore-base64.txt output/ 2>/dev/null || true
          ls -la output/

      - name: رفع حزمة التطبيق (APK & AAB)
        uses: actions/upload-artifact@v4
        with:
          name: yawmiyati-android-release
          path: output/*
          if-no-files-found: error

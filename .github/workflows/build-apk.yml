name: بناء تطبيق أندرويد

on:
  workflow_dispatch:          # زر تشغيل يدوي من تبويب Actions
  push:
    paths:
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write             # لإنشاء إصدار وإرفاق الـAPK به

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: جلب المستودع
        uses: actions/checkout@v4

      - name: تهيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: تهيئة Android SDK
        uses: android-actions/setup-android@v3

      - name: تهيئة Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: تجهيز مفتاح التوقيع
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          PASS="${STORE_PASS:-yawmiyati2026}"
          echo "PASS=$PASS" >> "$GITHUB_ENV"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "أستخدم مفتاحك المحفوظ في الأسرار"
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "NEW_KEY=no" >> "$GITHUB_ENV"
          else
            echo "لا يوجد مفتاح محفوظ — أُنشئ واحداً جديداً"
            keytool -genkeypair -v \
              -keystore android.keystore -alias yawmiyati \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Yawmiyati, OU=Personal, O=Yawmiyati, L=Mosul, C=IQ"
            base64 -w0 android.keystore > keystore-base64.txt
            echo "NEW_KEY=yes" >> "$GITHUB_ENV"
          fi

      - name: ربط Bubblewrap بأدوات النظام
        run: |
          bubblewrap updateConfig --jdkPath "$JAVA_HOME" --androidSdkPath "$ANDROID_SDK_ROOT"

      - name: توليد مشروع أندرويد من twa-manifest.json
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PASS }}
        run: |
          set -e
          yes | bubblewrap update --skipVersionUpgrade || bubblewrap update

      - name: البناء
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.PASS }}
        run: |
          set -e
          bubblewrap build --skipPwaValidation
          ls -la *.apk *.aab || true

      - name: استخراج بصمة التوقيع لملف assetlinks
        run: |
          keytool -list -v -keystore android.keystore -alias yawmiyati \
            -storepass "$PASS" | grep -A1 "SHA256:" | head -2 > fingerprint.txt || true
          cat fingerprint.txt || true

      - name: رفع المخرجات
        uses: actions/upload-artifact@v4
        with:
          name: yawmiyati-android
          path: |
            *.apk
            *.aab
            assetlinks.json
            fingerprint.txt
            keystore-base64.txt
          if-no-files-found: warn

      - name: تنبيه بحفظ المفتاح
        if: env.NEW_KEY == 'yes'
        run: |
          echo "::warning::أُنشئ مفتاح توقيع جديد. نزّل keystore-base64.txt من المخرجات وضع محتواه في Secrets باسم KEYSTORE_B64، وإلا لن تستطيع تحديث التطبيق لاحقاً بنفس التوقيع."
